name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - '**.tf'
      - 'scripts/aws_health_check.py'
      - 'requirements.txt'
      - '.github/workflows/terraform-*.yml'

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION: eu-west-3
  TF_VERSION: "1.9.0"

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_db_username: ${{ secrets.TF_DB_USERNAME }}
          TF_VAR_db_name: ${{ secrets.TF_DB_NAME }}
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}

      # Validate the deployed ASG, ALB targets, and CloudWatch alarms.
      - name: Install Python dependencies
        run: python3 -m pip install --requirement requirements.txt

      - name: AWS Health Check
        run: python3 scripts/aws_health_check.py --attempts 10 --interval 30
